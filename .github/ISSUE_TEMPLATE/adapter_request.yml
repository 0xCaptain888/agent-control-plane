name: Adapter request
description: Propose an exchange, chain, payment, MCP, x402, or workflow adapter.
title: "[adapter] "
labels: [enhancement, adapter]
body:
  - type: markdown
    attributes:
      value: |
        Keep the control-plane contract domain-neutral. Do not include production credentials or private endpoint details.
  - type: input
    id: target
    attributes:
      label: Target system
      description: Which exchange, chain, payment rail, tool, or workflow should be supported?
      placeholder: Base Sepolia / x402 / MCP server
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What agent action should this adapter guard, verify, and receipt?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and verification model
      description: Describe permissions, budget limits, failure modes, and the outcome that proves success.
    validations:
      required: true
