name: Deploy Marketplace

on:
  push:
    branches: [main]
    paths:
      - "apps/marketplace/src/**"
      - "docs/**"
      - "deployments/*.json"
      - ".github/workflows/deploy-marketplace.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build judge site artifact
        run: |
          mkdir -p _site/docs _site/deployments
          cp -R apps/marketplace/src/. _site/
          cp docs/*.md _site/docs/
          cp deployments/*.json _site/deployments/
      - name: Upload Marketplace
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
