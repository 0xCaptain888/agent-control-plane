<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">AgentGuard VerifyPay logo</title>
  <desc id="desc">A shield containing an agent network, verification check, and guarded payment.</desc>
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0B90B"/>
      <stop offset="1" stop-color="#FFD84D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Mark: policy shield + two cooperating agents + verified settlement -->
  <g transform="translate(24 20)">
    <path d="M140 8 260 52v91c0 76-49 126-120 157C69 269 20 219 20 143V52Z"
      fill="#0B1728" stroke="url(#shield)" stroke-width="12" stroke-linejoin="round"/>
    <path d="M140 42 226 73v69c0 53-31 90-86 116-55-26-86-63-86-116V73Z"
      fill="#101F33" stroke="#284563" stroke-width="2"/>
    <path d="M86 139h45m18 0h45M140 104v35m0 0v56" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="82" cy="139" r="18" fill="#22D3EE" filter="url(#glow)"/>
    <circle cx="198" cy="139" r="18" fill="#60A5FA" filter="url(#glow)"/>
    <circle cx="140" cy="92" r="18" fill="#A78BFA" filter="url(#glow)"/>
    <circle cx="140" cy="200" r="26" fill="#123C2E" stroke="#34D399" stroke-width="5"/>
    <path d="m127 200 9 9 19-22" fill="none" stroke="#6EE7B7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="140" cy="139" r="7" fill="#F0B90B"/>
  </g>

  <g transform="translate(350 82)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="0" y="72" fill="#F8FAFC" font-size="68" font-weight="800" letter-spacing="-2">AgentGuard</text>
    <text x="4" y="128" fill="#F0B90B" font-size="38" font-weight="700" letter-spacing="1">VERIFY<tspan fill="#CBD5E1">PAY</tspan></text>
    <rect x="5" y="156" width="260" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="5" y="198" fill="#94A3B8" font-size="21" font-weight="500" letter-spacing=".3">Policy-controlled Agent-to-Agent commerce</text>
  </g>
</svg>
