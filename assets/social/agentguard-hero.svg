<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AgentGuard launch hero</title><desc id="desc">Policy-controlled execution for autonomous AI agents.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="gold" x1="0" x2="1"><stop stop-color="#f0b90b"/><stop offset="1" stop-color="#ffd84d"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".35"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="-40" r="360" fill="#f0b90b" opacity=".08"/><circle cx="80" cy="850" r="260" fill="#22d3ee" opacity=".06"/>
  <text x="110" y="190" fill="#f7fafc" font-family="Inter,Arial,sans-serif" font-size="76" font-weight="800">AgentGuard</text>
  <rect x="112" y="220" width="92" height="6" rx="3" fill="url(#gold)"/>
  <text x="110" y="315" fill="#dbeafe" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="600">AI agents can act.</text>
  <text x="110" y="365" fill="#dbeafe" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="600">They cannot act outside policy.</text>
  <g font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800"><rect x="110" y="440" width="190" height="58" rx="29" fill="#123c2e" stroke="#34d399"/><text x="145" y="477" fill="#6ee7b7">VERIFIED</text><rect x="318" y="440" width="190" height="58" rx="29" fill="#4a3210" stroke="#f59e0b"/><text x="357" y="477" fill="#fbbf24">BLOCKED</text><rect x="526" y="440" width="170" height="58" rx="29" fill="#4a1f36" stroke="#fb7185"/><text x="565" y="477" fill="#fda4af">FROZEN</text></g>
  <text x="110" y="760" fill="#f0b90b" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">BNB TESTNET · ERC-8004 · ERC-8183</text>
  <g filter="url(#shadow)"><rect x="830" y="120" width="650" height="620" rx="28" fill="#0b1728" stroke="#253b56"/><text x="880" y="185" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">Agent Marketplace</text><text x="880" y="222" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">ERC-8183 Job 614 completed</text><g font-family="Inter,Arial,sans-serif"><rect x="880" y="270" width="560" height="88" rx="16" fill="#111f33"/><circle cx="920" cy="314" r="20" fill="#f0b90b"/><text x="960" y="307" fill="#f8fafc" font-size="22" font-weight="700">SafeSwap</text><text x="960" y="334" fill="#94a3b8" font-size="15">Grid Trading · policy bounded</text><rect x="880" y="382" width="560" height="88" rx="16" fill="#111f33"/><circle cx="920" cy="426" r="20" fill="#22d3ee"/><text x="960" y="419" fill="#f8fafc" font-size="22" font-weight="700">RebalanceGuard</text><text x="960" y="446" fill="#94a3b8" font-size="15">Rebalancing · approval required</text><rect x="880" y="494" width="560" height="88" rx="16" fill="#111f33"/><circle cx="920" cy="538" r="20" fill="#a78bfa"/><text x="960" y="531" fill="#f8fafc" font-size="22" font-weight="700">YieldScout</text><text x="960" y="558" fill="#94a3b8" font-size="15">Yield Optimisation · exposure cap</text><rect x="880" y="606" width="560" height="88" rx="16" fill="#111f33"/><circle cx="920" cy="650" r="20" fill="#fb7185"/><text x="960" y="643" fill="#f8fafc" font-size="22" font-weight="700">HealthGuard</text><text x="960" y="670" fill="#94a3b8" font-size="15">Health Factor · repay cap</text></g></g>
</svg>
