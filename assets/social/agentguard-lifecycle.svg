<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AgentGuard execution lifecycle</title><desc id="desc">Intent, policy, risk checks, execution, verification, settlement and receipt.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111827"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f0b90b"/></marker></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="100" y="100" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="800">AgentGuard execution lifecycle</text><text x="100" y="145" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="22">One control plane. Every Agent action stays bounded.</text><g font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle"><g fill="#13263e" stroke="#f0b90b" stroke-width="2"><rect x="90" y="270" width="170" height="90" rx="18"/><rect x="300" y="270" width="170" height="90" rx="18"/><rect x="510" y="270" width="170" height="90" rx="18"/><rect x="720" y="270" width="190" height="90" rx="18"/><rect x="950" y="270" width="210" height="90" rx="18"/><rect x="1200" y="270" width="150" height="90" rx="18"/><rect x="1390" y="270" width="170" height="90" rx="18"/></g><g fill="#f8fafc"><text x="175" y="323">Intent</text><text x="385" y="323">Policy Gate</text><text x="595" y="323">Risk Checks</text><text x="815" y="310">Adapter</text><text x="815" y="338">Execution</text><text x="1055" y="310">Outcome</text><text x="1055" y="338">Verification</text><text x="1275" y="323">Settlement</text><text x="1475" y="310">Auditable</text><text x="1475" y="338">Receipt</text></g><g stroke="#f0b90b" stroke-width="4" marker-end="url(#arrow)"><path d="M260 315H295"/><path d="M470 315H505"/><path d="M680 315H715"/><path d="M910 315H945"/><path d="M1160 315H1195"/><path d="M1350 315H1385"/></g></g><text x="1055" y="430" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="20" text-anchor="middle">Verification decides whether payment can move</text><g font-family="Inter,Arial,sans-serif"><rect x="140" y="510" width="390" height="150" rx="22" fill="#123c2e" stroke="#34d399" stroke-width="3"/><text x="180" y="565" fill="#6ee7b7" font-size="30" font-weight="800">VERIFIED</text><text x="180" y="610" fill="#d1fae5" font-size="21">release payment</text><rect x="605" y="510" width="390" height="150" rx="22" fill="#4a3210" stroke="#f59e0b" stroke-width="3"/><text x="645" y="565" fill="#fbbf24" font-size="30" font-weight="800">BLOCKED</text><text x="645" y="610" fill="#fef3c7" font-size="21">stop before execution</text><rect x="1070" y="510" width="390" height="150" rx="22" fill="#4a1f36" stroke="#fb7185" stroke-width="3"/><text x="1110" y="565" fill="#fda4af" font-size="30" font-weight="800">FROZEN</text><text x="1110" y="610" fill="#ffe4e6" font-size="21">hold payment + recover</text></g><g fill="#67e8f9" font-family="Inter,Arial,sans-serif" font-size="18"><text x="150" y="760">budget</text><text x="300" y="760">permissions</text><text x="485" y="760">risk limits</text><text x="680" y="760">evidence</text></g></svg>
